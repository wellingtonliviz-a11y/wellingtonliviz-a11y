# Blueprint do Render para o Precifica Fácil Manicure (site + banco PostgreSQL próprios).
# Coloque a pasta "agenda-manicure" no repositório, ao lado de "calculadora-precos",
# e no Render: New > Blueprint > escolha o repositório e aponte para este arquivo.
services:
  - type: web
    name: precifica-manicure
    runtime: python
    rootDir: agenda-manicure
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --preload --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /saude
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: precifica-manicure-db
          property: connectionString
      - key: PRODUCT_NAME
        value: Precifica Fácil Manicure
      - key: PLAN_PRICE
        value: "49,90"
      - key: TIMEZONE
        value: America/Sao_Paulo
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: HOTMART_HOTTOK
        sync: false
      - key: HOTMART_PRODUCT_IDS
        sync: false
      - key: KIWIFY_TOKEN
        sync: false
      - key: KIWIFY_PRODUCT_IDS
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_PAYMENT_LINK_IDS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: CHECKOUT_URL
        sync: false

databases:
  - name: precifica-manicure-db
    plan: basic-256mb
