{% extends "base.html" %}
{% block title %}Minha senha{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Trocar minha senha</h1><p>{{ current_user.email }}</p></div></div>
<form method="post" class="card" style="max-width:460px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="stack">
    <label class="field"><span>Senha atual</span><input type="password" name="current" required autocomplete="current-password"></label>
    <label class="field"><span>Nova senha</span><input type="password" name="password" required minlength="6" autocomplete="new-password"></label>
    <label class="field"><span>Repita a nova senha</span><input type="password" name="password2" required minlength="6" autocomplete="new-password"></label>
  </div>
  <div class="form-actions"><button class="btn" type="submit">Salvar</button></div>
</form>
{% endblock %}
