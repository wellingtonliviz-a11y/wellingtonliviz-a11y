# Blueprint do Render: cria o site e o banco PostgreSQL de uma vez.
# No Render: New > Blueprint > escolha este repositório.
services:
  - type: web
    name: precifica-facil
    runtime: python
    rootDir: calculadora-precos
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --preload --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /saude
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: precifica-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: HOTMART_HOTTOK
        sync: false
      - key: KIWIFY_TOKEN
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_PAYMENT_LINK_IDS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: CHECKOUT_URL
        sync: false

databases:
  - name: precifica-db
    plan: basic-256mb
